# Builds XMS for Linux, macOS and Windows and publishes the binaries:
# - on every push to main, as a pre-release "Build N" of the version in
#   Cargo.toml (the version does not change with a push);
# - on a pushed tag v<version> (v0.2.0), as the release "Imago 0.2.0", marked
#   latest, with that version's section of CHANGELOG.md as its notes. The tag
#   has to match the version in Cargo.toml. See docs/releases.md.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The build's number, compiled in: Imago shows "0.2.0 · build 155 (a1b2c3d)"
  # (the commit is GitHub's GITHUB_SHA).
  XMS_BUILD: ${{ github.run_number }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # A release's tag is its version: v0.2.0 for version = "0.2.0".
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-x11-0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The example files fetched on demand, so the regression suite runs
      # in full (without them the templates needing them are skipped).
      - name: Example files
        if: matrix.name == 'linux-x86_64'
        uses: actions/cache@v4
        with:
          path: |
            examples/usd/carbon_frame_bike
            examples/usd/elephant
            examples/mocap/novasci/*.fbx
          key: example-downloads-${{ hashFiles('src/examples.rs') }}

      - name: Download example files
        if: matrix.name == 'linux-x86_64'
        run: cargo test --release --target ${{ matrix.target }} download_example_files -- --ignored

      - name: Test
        if: matrix.name == 'linux-x86_64'
        timeout-minutes: 60
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      # Linux: linked against glibc 2.28 (Rocky Linux 8, RHEL 8 and newer)
      # by cargo-zigbuild, rather than the runner's own glibc, so the
      # binary runs on older distributions too. The windowing and graphics
      # libraries are loaded at run time and need no matching version.
      - name: Zig
        if: runner.os == 'Linux'
        run: |
          pip install ziglang==0.17.0
          cargo install cargo-zigbuild --version 0.24.0 --locked

      - name: Build (Linux, glibc 2.28)
        if: runner.os == 'Linux'
        run: |
          cargo zigbuild --release --target ${{ matrix.target }}.2.28
          newest=$(objdump -T target/${{ matrix.target }}/release/xms-imago | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Newest glibc symbol: $newest"
          test "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -1)" = "GLIBC_2.28"

      # The documentation's HTML, made from the Markdown into docs/html, so
      # the package has it to open in a browser (Help > Documentation).
      - name: Documentation
        run: cargo run --release -p xms-docs

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir xms-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/xms-imago xms-${{ matrix.name }}/xms
          cp README.md xms-${{ matrix.name }}/
          cp -r docs examples xms-${{ matrix.name }}/
          cp -r assets/compounds xms-${{ matrix.name }}/compounds
          tar czf xms-${{ matrix.name }}.tar.gz xms-${{ matrix.name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory xms-${{ matrix.name }}
          Copy-Item target/${{ matrix.target }}/release/xms-imago.exe xms-${{ matrix.name }}/xms.exe
          Copy-Item README.md xms-${{ matrix.name }}/
          Copy-Item -Recurse docs xms-${{ matrix.name }}/
          Copy-Item -Recurse examples xms-${{ matrix.name }}/
          Copy-Item -Recurse assets/compounds xms-${{ matrix.name }}/compounds
          Compress-Archive -Path xms-${{ matrix.name }} -DestinationPath xms-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: xms-${{ matrix.name }}
          path: |
            xms-${{ matrix.name }}.tar.gz
            xms-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Release
    needs: build
    # Publish whatever built, even if one platform failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # For CHANGELOG.md, a release's notes.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          test -n "$(ls dist)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A release: named for its version, its notes the changelog's
            # section for it (GitHub's list of changes when there is none).
            version="${GITHUB_REF_NAME#v}"
            awk -v v="$version" '
              $0 ~ "^## \\[?" v "\\]?([ ]|$)" { on = 1; next }
              on && /^## / { exit }
              on' CHANGELOG.md > notes.md || true
            if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "Imago $version" \
              "${notes[@]}" \
              --latest
          else
            # A build of main: a pre-release, never "latest", so the latest
            # release (and the website's download buttons) stay on a version.
            tag="build-${{ github.run_number }}"
            gh release create "$tag" dist/* \
              --target "${{ github.sha }}" \
              --title "Build ${{ github.run_number }}" \
              --notes "Automatic build of ${{ github.sha }}. ${{ github.event.head_commit.message }}" \
              --prerelease
          fi
