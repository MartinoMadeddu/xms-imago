[package]
name = "xms-imago"
version = "0.1.5"
edition = "2021"
# egui 0.36 and egui_dock 0.21 need Rust 1.95.
rust-version = "1.95"

[workspace]
members = [".", "crates/ragdoll", "crates/xms-scene", "crates/xms-usd", "crates/xms-matx", "crates/xms-geo", "crates/xms-ice", "crates/xms-image"]
resolver = "2"


[workspace.package]
version = "0.1.0"
edition = "2021"

[dependencies]
xms-scene = { path = "crates/xms-scene" }
xms-usd   = { path = "crates/xms-usd" }
xms-matx  = { path = "crates/xms-matx" }
# The geometry model, and the ICE engine on it.
xms-geo   = { path = "crates/xms-geo" }
xms-ice   = { path = "crates/xms-ice" }
# Images: renders as layers of float channels, OpenEXR read whole, and their view.
xms-image = { path = "crates/xms-image" }

glam = { version = "0.27", features = ["serde"] }
egui = "0.36"
# The shell: a window, egui, and wgpu for the Viewer.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# Vertex data to the GPU, for the Viewer.
bytemuck = "1"
# Making a big stage's geometry on every core.
rayon = "1"
# Pure-Rust OpenUSD: .usda/.usdc/.usdz with composition
openusd = "0.1.4"
ufbx = "0.11"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr", "tiff", "tga", "hdr"] }
egui_dock = { version = "0.21", features = ["serde"] }
# The collision solver, in the repository. Its own crate, so that it is
# compiled fully optimised in a development build too.
xms_ragdoll = { path = "crates/ragdoll" }
# Downloading example files a template asks for (HTTPS, with rustls).
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }

# Heavy scenes need optimised code even while developing: the program
# itself lightly, everything it depends on fully. The first build after this
# takes longer; later ones do not.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The crates of this workspace are not covered by "*" above: the solver and
# the USD reader are as heavy as any dependency.
[profile.dev.package.xms_ragdoll]
opt-level = 3
[profile.dev.package.xms-usd]
opt-level = 3
[profile.dev.package.xms-scene]
opt-level = 3
[profile.dev.package.xms-geo]
opt-level = 3
[profile.dev.package.xms-ice]
opt-level = 3
# Showing a 4K image's layer is a loop over every pixel.
[profile.dev.package.xms-image]
opt-level = 3
