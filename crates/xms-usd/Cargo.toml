[package]
name = "xms-usd"
version.workspace = true
edition.workspace = true
description = "OpenUSD stage -> xms-scene translation for XMS | Imago"

[dependencies]
xms-scene = { path = "../xms-scene" }
# Imago's fork of openusd 0.8 (branch `xms`): formats beyond usda, usdc and
# usdz can be registered (`sdf::LayerRegistry::register_format`), for Alembic.
openusd = { git = "https://github.com/MartinoMadeddu/openusd", branch = "xms" }
rustc-hash = "2"
rayon = "1.10"
nalgebra = "0.34"